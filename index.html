<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Preview of Parakh: verified international remote jobs for Indian candidates.">
<title>Parakh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>/* Parakh design: navy ink, one orange accent, Archivo display / Figtree body / JetBrains Mono for numbers. */
:root {
  --bg: #F2F5F7; --surface: #FFFFFF; --sunk: #E8EDF2; --ink: #0F1E33; --muted: #566880; --line: #D6DEE7;
  --accent: #B05000; --accent-ink: #FFFFFF; --accent-soft: #FDEBDA;
  --ok: #0B7A5B; --ok-soft: #DDF2EA; --warn: #8F5A0B; --warn-soft: #FBEFD8; --bad: #B42F25; --bad-soft: #FBE3DF;
  --shadow: 0 1px 2px rgba(15,30,51,.06), 0 8px 24px rgba(15,30,51,.07);
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0B1524; --surface: #122038; --sunk: #0F1B2F; --ink: #E6EDF6; --muted: #97A9BE; --line: #22324C;
  --accent: #F2862A; --accent-ink: #1A0E02; --accent-soft: #3A2412;
  --ok: #3DC495; --ok-soft: #0F3A30; --warn: #E5AC4E; --warn-soft: #3A2D13; --bad: #F06B5F; --bad-soft: #3F1D1C;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0B1524; --surface: #122038; --sunk: #0F1B2F; --ink: #E6EDF6; --muted: #97A9BE; --line: #22324C;
  --accent: #F2862A; --accent-ink: #1A0E02; --accent-soft: #3A2412;
  --ok: #3DC495; --ok-soft: #0F3A30; --warn: #E5AC4E; --warn-soft: #3A2D13; --bad: #F06B5F; --bad-soft: #3F1D1C;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35); color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-top: 80px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--f-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
p { margin: 0; }
a { color: inherit; text-decoration: underline; text-decoration-color: var(--muted); text-underline-offset: 3px; }
a:hover { text-decoration-color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main:focus { outline: none; }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font: 600 12px/1.4 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.muted, .hint { color: var(--muted); } .hint { font-size: 13px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip-link { position: absolute; left: 12px; top: -60px; z-index: 70; background: var(--accent); color: var(--accent-ink); padding: 8px 14px; border-radius: 8px; font-weight: 600; text-decoration: none; }
.skip-link:focus { top: 12px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 10px 16px; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; text-decoration: none; white-space: nowrap;
  transition: transform .12s ease, box-shadow .2s ease, background .2s, border-color .2s; }
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); border-color: var(--muted); }
.btn:active { transform: translateY(0) scale(.97); box-shadow: none; }
.btn:disabled { opacity: .55; cursor: not-allowed; transform: none; box-shadow: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--sunk); box-shadow: none; }
.btn.sm { padding: 7px 12px; font-size: 14px; }
.btn.ok { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--ink); font-weight: 600; cursor: pointer; text-decoration: underline; text-decoration-color: var(--muted); text-underline-offset: 3px; }
.linkbtn:hover { text-decoration-color: var(--accent); }

/* Header */
header.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.bar .wrap { display: flex; align-items: center; gap: 12px; min-height: 62px; }
.logo { display: flex; align-items: center; gap: 10px; font: 800 21px/1 var(--f-display); font-stretch: 118%; letter-spacing: -.02em; text-decoration: none; color: var(--ink); }
.logo small { font: 500 11px/1 var(--f-mono); color: var(--muted); letter-spacing: 0; font-stretch: 100%; }
.nav { display: flex; gap: 2px; margin-left: auto; overflow-x: auto; scrollbar-width: none; align-items: center; }
.nav a, .nav button { padding: 8px 12px; border-radius: 7px; font-weight: 500; font-size: 15px; color: var(--muted); text-decoration: none; white-space: nowrap; background: none; border: 0; cursor: pointer; }
.nav a:hover, .nav button:hover { color: var(--ink); background: var(--sunk); }
.nav a[aria-current="page"] { color: var(--ink); background: var(--sunk); }
.nav a.btn.primary { color: var(--accent-ink); background: var(--accent); margin-left: 4px; }
@media (max-width: 760px) { .bar .wrap { flex-wrap: wrap; padding-block: 8px; } .nav { order: 3; width: 100%; margin-left: 0; } }
@media (max-width: 420px) { .nav a, .nav button { padding: 8px 8px; font-size: 14px; } }

main { padding-block: 28px 56px; min-height: 60vh; }
footer { border-top: 1px solid var(--line); padding-block: 24px; color: var(--muted); font-size: 13px; }
footer .wrap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* Jobs */
.hero { display: grid; grid-template-columns: 1.2fr .8fr; gap: 40px; align-items: end; padding-block: 12px 28px; }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; gap: 20px; } }
.hero h1 { font-size: clamp(32px, 5vw, 56px); line-height: 1.03; font-weight: 800; font-stretch: 112%; margin-top: 12px; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero .lede { margin-top: 14px; font-size: 17px; color: var(--muted); max-width: 56ch; }
.status { border-left: 3px solid var(--accent); padding: 4px 0 4px 14px; font-size: 14px; color: var(--muted); display: grid; gap: 6px; }
.status b { color: var(--ink); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); display: inline-block; margin-right: 6px; }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.toolbar input, .toolbar select { flex: 1 1 220px; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.toolbar select { flex: 0 1 200px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 14px; cursor: pointer; transition: background .15s, border-color .15s; }
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.count { font-size: 14px; color: var(--muted); margin-left: auto; }
.jobs { display: grid; gap: 10px; }
.job { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 16px; align-items: center; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); padding: 16px; transition: border-color .2s, box-shadow .2s; }
.job:hover { border-color: var(--muted); box-shadow: var(--shadow); }
.job h2 { font-size: 18px; font-stretch: 104%; font-weight: 700; }
.job h2 a { text-decoration: none; } .job h2 a:hover { text-decoration: underline; text-decoration-color: var(--accent); }
.co { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 14px; color: var(--muted); margin-top: 3px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tag { font-size: 12px; padding: 3px 8px; border-radius: 5px; background: var(--sunk); color: var(--muted); font-weight: 500; }
.tag.seg { background: var(--accent-soft); color: var(--accent); }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.side { display: grid; gap: 8px; justify-items: end; text-align: right; }
.side .pay { font: 500 13px var(--f-mono); color: var(--muted); }
.acts { display: flex; gap: 6px; flex-wrap: wrap; }
@media (max-width: 640px) {
  .job { grid-template-columns: 52px minmax(0, 1fr); }
  .side { grid-column: 1 / -1; justify-items: start; text-align: left; grid-template-columns: 1fr auto; align-items: center; border-top: 1px dashed var(--line); padding-top: 12px; }
}
.empty { padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); background: var(--surface); }
.empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }
.sources { margin-top: 14px; font-size: 13px; color: var(--muted); }

/* Score dial */
.seal { --c: var(--ok); position: relative; width: 52px; height: 52px; flex: none; }
.seal svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.seal .n { position: absolute; inset: 0; display: grid; place-items: center; font: 700 16px/1 var(--f-mono); color: var(--c); }
.seal.warn { --c: var(--warn); } .seal.bad { --c: var(--bad); } .seal.none { --c: var(--muted); }
.seal circle { fill: none; stroke-width: 5; }
.seal .trk { stroke: var(--line); } .seal .arc { stroke: var(--c); stroke-linecap: round; transition: stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1); }

.blocked { margin-top: 20px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px 16px; }
.blocked summary { cursor: pointer; font-weight: 600; display: flex; gap: 10px; align-items: center; list-style: none; }
.blocked summary::-webkit-details-marker { display: none; }
.blocked ul { margin: 12px 0 0; padding-left: 20px; font-size: 14px; color: var(--muted); display: grid; gap: 8px; }
.blocked ul b { color: var(--ink); font-weight: 600; }

/* Check lists */
.checks { list-style: none; margin: 0; padding: 0; display: grid; }
.checks li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 9px 0; border-top: 1px dashed var(--line); font-size: 14px; }
.checks li:first-child { border-top: 0; }
.checks .val { font-family: var(--f-mono); font-size: 13px; color: var(--muted); text-align: right; max-width: 24ch; }
.checks .det { grid-column: 2 / -1; font-size: 13px; color: var(--muted); margin-top: -4px; }
.st { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--sunk); color: var(--muted); }
.st.ok { background: var(--ok-soft); color: var(--ok); } .st.warn { background: var(--warn-soft); color: var(--warn); } .st.bad { background: var(--bad-soft); color: var(--bad); }
.st.run { border: 2px solid var(--line); border-top-color: var(--accent); background: none; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Sections, cards, forms */
.sec-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.sec-head h1 { font-size: clamp(26px, 3.4vw, 36px); font-weight: 750; font-stretch: 108%; }
.sec-head p { color: var(--muted); margin-top: 6px; max-width: 62ch; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
@media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
.stack { display: grid; gap: 24px; align-content: start; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; min-width: 0; }
.card h2 { font-size: 18px; font-stretch: 106%; margin-bottom: 12px; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 520px) { .fields { grid-template-columns: 1fr; } }
.field { display: grid; gap: 6px; min-width: 0; align-content: start; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 13px; font-weight: 600; }
.field input, .field select, .field textarea { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); min-width: 0; width: 100%; }
.field textarea { min-height: 150px; resize: vertical; line-height: 1.5; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.drop { grid-column: 1 / -1; border: 1.5px dashed var(--line); border-radius: 10px; padding: 20px; text-align: center; cursor: pointer; transition: border-color .2s, background .2s; background: var(--bg); display: block; }
.drop:hover, .drop.over, .drop:focus-within { border-color: var(--accent); background: var(--accent-soft); }
.drop b { display: block; font-size: 15px; } .drop span { font-size: 13px; color: var(--muted); }
.file { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); grid-column: 1 / -1; min-width: 0; }
.file .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.track { display: grid; }
.track > div { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); font-size: 14px; align-items: center; }
.track > div:first-child { border-top: 0; }
.track small { display: block; color: var(--muted); }
.track select { padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); font-size: 13px; }
.matches { display: grid; gap: 10px; }
.match { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.match .fit { font: 700 15px var(--f-mono); color: var(--ok); min-width: 42px; }
.match p { font-size: 14px; color: var(--muted); margin-top: 2px; }

/* Pricing */
.plans { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
@media (max-width: 860px) { .plans { grid-template-columns: 1fr; } }
.plan { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px; display: grid; gap: 14px; align-content: start; cursor: pointer; transition: border-color .2s, box-shadow .2s, transform .15s; }
.plan:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.plan[aria-checked="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.plan .top { display: flex; justify-content: space-between; align-items: center; }
.plan h2 { font-size: 20px; font-stretch: 108%; }
.price { display: flex; align-items: baseline; gap: 8px; }
.price b { font: 700 34px/1 var(--f-mono); } .price span { color: var(--muted); font-size: 14px; }
.plan ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 14px; }
.plan li { display: flex; gap: 8px; } .plan li::before { content: "✓"; color: var(--ok); font-weight: 700; }
.plan .roles { font-size: 13px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 12px; }
.radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
.plan[aria-checked="true"] .radio { border-color: var(--accent); }
.plan[aria-checked="true"] .radio::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.pill { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; display: inline-block; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.bad { background: var(--bad-soft); color: var(--bad); } .pill.n { background: var(--sunk); color: var(--muted); }
.note { font-size: 13px; color: var(--muted); margin-top: 12px; }
.notice { padding: 12px 14px; border-radius: 10px; background: var(--warn-soft); color: var(--ink); font-size: 14px; margin-bottom: 16px; }
.notice.ok { background: var(--ok-soft); } .notice.bad { background: var(--bad-soft); }

/* Report */
.verdict { display: flex; align-items: center; gap: 14px; padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); margin-top: 14px; }
.verdict strong { display: block; font-size: 16px; } .verdict p { font-size: 14px; color: var(--muted); }
.facts { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 0; }
.facts div { padding: 12px 14px; border-top: 1px solid var(--line); border-left: 1px solid var(--line); min-width: 0; }
.facts div:nth-child(-n+2) { border-top: 0; } .facts div:nth-child(odd) { border-left: 0; }
.facts dt { font-size: 12px; color: var(--muted); } .facts dd { margin: 2px 0 0; font: 600 14px var(--f-mono); overflow-wrap: anywhere; }
.sub { font: 700 15px var(--f-display); margin-bottom: 8px; }
.lock { padding: 16px; border: 1px dashed var(--line); border-radius: 10px; text-align: center; font-size: 14px; color: var(--muted); }
.bars { display: flex; align-items: flex-end; gap: 4px; height: 64px; margin: 8px 0 22px; }
.bars div { flex: 1; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 3px; position: relative; }
.bars span { position: absolute; bottom: -18px; left: 0; right: 0; text-align: center; font: 10px var(--f-mono); color: var(--muted); }
.desc { white-space: pre-wrap; font-size: 15px; }
.report-grid { display: grid; gap: 22px; }

table.admin { width: 100%; border-collapse: collapse; font-size: 14px; }
table.admin th, table.admin td { text-align: left; padding: 10px 8px; border-top: 1px solid var(--line); vertical-align: top; }
table.admin th { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); border-top: 0; }
.scroll { overflow-x: auto; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.stat { background: var(--bg); border-radius: 10px; padding: 12px; } .stat b { display: block; font: 700 22px var(--f-mono); }

/* Company drawer */
.scrim { position: fixed; inset: 0; background: rgba(8,14,24,.45); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .25s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); z-index: 50; transform: translateX(100%); visibility: hidden;
  transition: transform .32s cubic-bezier(.2,.8,.2,1), visibility 0s .32s; display: flex; flex-direction: column; border-left: 1px solid var(--line);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer.on { transform: none; visibility: visible; transition: transform .32s cubic-bezier(.2,.8,.2,1); }
.dr-head { display: flex; gap: 14px; align-items: center; padding: 18px 20px; border-bottom: 1px solid var(--line); }
.dr-head h2 { font-size: 22px; font-stretch: 108%; } .dr-head p { font-size: 14px; color: var(--muted); }
.dr-head .x { margin-left: auto; }
.dr-body { overflow: auto; padding: 20px; display: grid; gap: 22px; align-content: start; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: var(--bg);
  padding: 11px 16px; border-radius: 9px; font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 60; max-width: calc(100% - 32px); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

.preview-bar { background: var(--warn-soft); color: var(--ink); font-size: 13px; text-align: center; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.modal { position: fixed; inset: 0; background: rgba(8,14,24,.45); display: grid; place-items: center; padding: 16px; z-index: 80; }
.modal .card { max-width: 420px; width: 100%; }
</style>
</head>
<body>
<div class="preview-bar">Preview with sample companies. Logins, resume upload and payments are simulated and nothing is saved.</div>

  <a class="skip-link" href="#app">Skip to content</a>
  <header class="bar">

<script>// Preview-only: answers the site's API calls in the browser using captured sample data.
const RANK = { basic: 1, pro: 2, premium: 3 };
const mock = { user: null, plans: [], apps: [], requests: [] };
const reply = (status, body) => ({ ok: status < 400, status, json: async () => body });
const err = (status, error, extra = {}) => reply(status, { error, ...extra });
const today = (d = 0) => new Date(Date.now() + d * 864e5).toISOString().slice(0, 19).replace('T', ' ');
const covers = seg => mock.plans.some(p => RANK[p.segment] >= RANK[seg]);
const FREE = 2;
const trial = () => ({ limit: FREE, used: Math.min(mock.apps.length, FREE), left: Math.max(0, FREE - mock.apps.length) });
function matchOf(job) {
  const skills = (mock.user?.skills || '').toLowerCase().split(',').map(s => s.trim()).filter(Boolean);
  if (!skills.length) return null;
  const text = `${job.title} ${job.tags || ''} ${job.snippet || job.description || ''}`.toLowerCase();
  return Math.round(100 * skills.filter(s => text.includes(s)).length / skills.length);
}

// Same red-flag rules as the server's lib/verify.js (website age lookup needs the server, so it's skipped here)
const RED_FLAGS = [
  { re: /(registration|joining|security|training|processing|refundable|kit)\s*(fee|deposit|charge)|pay (a|the)? ?(small )?fee|pay\s*(₹|rs\.?|inr|\$)\s*\d/i, label: 'Asks you to pay money', why: 'Real employers never charge to apply, train or send an offer.', level: 'bad', impact: 25 },
  { re: /whats\s?app|telegram|t\.me\/|wa\.me\//i, label: 'Recruiter only on WhatsApp or Telegram', why: 'Genuine recruiters use a company email or the company\'s hiring site.', level: 'bad', impact: 25 },
  { re: /@(gmail|yahoo|outlook|hotmail|rediffmail|proton)\./i, label: 'Personal email address (Gmail, Yahoo…)', why: 'Recruiters at real companies write from the company\'s own domain.', level: 'bad', impact: 10 },
  { re: /no (interview|experience) (needed|required).{0,40}(earn|\$|usd|₹)|earn\s*(\$|₹|rs\.?)\s*[\d,]{3,}.{0,20}(per|a|\/)\s*(day|week|task|hour)|per task|like (videos|posts)|rate (products|hotels)|task.based earning/i, label: 'Pay too good for the work', why: 'High daily pay for simple tasks is the most common task-scam hook.', level: 'bad', impact: 25 },
  { re: /gift ?card|crypto(currency)? payment|bitcoin|usdt/i, label: 'Gift cards or crypto payments', why: 'Employers pay salaries by bank transfer, Wise or Payoneer, not gift cards or crypto.', level: 'bad', impact: 25 },
  { re: /aadhaar|pan card|bank (details|account)|\botp\b|upi pin|send (your )?passport/i, label: 'Asks for ID or bank details early', why: 'Never share Aadhaar, PAN, bank details or OTPs before a signed offer.', level: 'bad', impact: 25 },
  { re: /limited seats|urgent(ly)? hiring|only today|act now|last \d+ (seats|slots)/i, label: 'Pressure to act fast', why: 'Urgency is used to stop you from checking.', level: 'warn', impact: 8 },
];
const BRANDS = ['amazon', 'flipkart', 'google', 'microsoft', 'meta', 'tcs', 'infosys', 'wipro', 'accenture', 'deloitte', 'ibm', 'hcl', 'netflix', 'apple'];
function scan({ text = '', company = '', website = '' }) {
  const hits = RED_FLAGS.filter(r => r.re.test(text));
  const domains = [...text.matchAll(/@([a-z0-9-]+(?:\.[a-z0-9-]+)+)/gi), ...text.matchAll(/https?:\/\/([^\s/]+)/gi)].map(m => m[1].toLowerCase());
  if (website) domains.push(website.toLowerCase().replace(/^https?:\/\//, '').split('/')[0]);
  const checks = RED_FLAGS.map(r => ({ label: r.label, status: hits.includes(r) ? r.level : 'ok', detail: hits.includes(r) ? r.why : '' }));
  let impact = hits.reduce((s, h) => s + h.impact, 0), bad = hits.filter(h => h.level === 'bad').length;
  const brand = BRANDS.find(b => new RegExp(`\\b${b}\\b`, 'i').test(text));
  if (brand && domains.length && !domains.some(d => d.split('.').includes(brand))) {
    const B = ['tcs', 'ibm', 'hcl'].includes(brand) ? brand.toUpperCase() : brand[0].toUpperCase() + brand.slice(1);
    checks.unshift({ label: `Uses ${B}'s name, but not its website or email`, status: 'bad', detail: `Real ${B} recruiters write from their company email and list jobs on ${B}'s own careers site.` });
    impact += 25; bad++;
  }
  const known = Object.values(DATA.company).find(c => company && c.company.name.toLowerCase() === company.trim().toLowerCase());
  const score = Math.max(0, Math.min(100, 80 - impact + (known?.unlocked.level === 'verified' ? 10 : 0)));
  return { score, verdict: bad >= 2 || score < 45 ? 'scam' : bad === 1 || score < 70 ? 'suspicious' : 'clear', checks,
    known: known ? { id: known.company.id, name: known.company.name, website: known.company.website, score: known.unlocked.score, level: known.unlocked.level } : null };
}

window.fetch = async (url, opts = {}) => {
  const u = new URL(url, 'https://preview.local');
  const p = u.pathname, m = (opts.method || 'GET').toUpperCase();
  const body = typeof opts.body === 'string' ? JSON.parse(opts.body) : opts.body;
  let x;
  if (p === '/api/me') return reply(200, { user: mock.user, plans: mock.plans, trial: trial() });
  if (p === '/api/signup' || p === '/api/login') {
    if (!body.email || !body.password || body.password.length < 8) return err(400, 'Enter an email and a password of at least 8 characters');
    mock.user = { id: 1, email: body.email, name: body.name || body.email.split('@')[0], skills: '', phone: '', target_role: '', hours: '', linkedin_url: '', experience_years: 0, resume_name: null, is_admin: 0 };
    return reply(200, { user: mock.user });
  }
  if (p === '/api/logout') { mock.user = null; mock.plans = []; mock.apps = []; return reply(200, { ok: true }); }
  if (p === '/api/profile' && m === 'PUT') { Object.assign(mock.user, body); return reply(200, { user: mock.user }); }
  if (p === '/api/profile/resume') {
    const f = body.get('resume');
    if (!f?.name || !/\.(pdf|docx?)$/i.test(f.name)) return err(400, 'Upload a PDF/DOC/DOCX up to 5 MB');
    mock.user.resume_name = f.name; return reply(200, { user: mock.user });
  }
  if (p === '/api/profile/applications') return reply(200, mock.apps);
  if ((x = p.match(/^\/api\/profile\/applications\/(\d+)$/))) { const a = mock.apps.find(a => a.job_id == x[1]); if (a) a.status = body.status; return reply(200, { ok: true }); }
  if (p === '/api/pricing') return reply(200, { ...DATA.pricing, payments: 'demo' });
  if (p === '/api/checkout') {
    const s = DATA.pricing.segments.find(s => s.key === body.segment);
    return reply(200, { mode: 'demo', subscription_id: s.key, amount_inr: s.inr });
  }
  if (p === '/api/checkout/verify') {
    const s = DATA.pricing.segments.find(s => s.key === body.subscription_id);
    mock.plans.unshift({ segment: s.key, amount_inr: s.inr, expires_at: today(DATA.pricing.days) });
    return reply(200, { ok: true, plans: mock.plans });
  }
  if (p === '/api/scan') {
    if ((body.text || '').trim().length < 30) return err(400, 'Paste the full job post or message, at least a few lines.');
    return reply(200, scan(body));
  }
  if (p === '/api/check-requests') {
    if (!mock.user) return err(401, 'Please log in first');
    if (mock.requests.includes(body.company.toLowerCase())) return err(409, 'You already asked for this company. We\'ll add its report after we research it.');
    mock.requests.push(body.company.toLowerCase()); return reply(200, { ok: true });
  }
  if (p === '/api/sources') return reply(200, { sources: [
    ['Remotive', 'https://remotive.com'], ['Himalayas', 'https://himalayas.app'], ['Remote OK', 'https://remoteok.com'], ['Jobicy', 'https://jobicy.com'],
    ['Working Nomads', 'https://www.workingnomads.com'], ['We Work Remotely', 'https://weworkremotely.com'], ['Company careers pages', null], ['Added by our team', null],
  ].map(([label, site]) => ({ label, site, open: 0 })) });
  if (p === '/api/jobs') {
    const q = (u.searchParams.get('q') || '').toLowerCase(), seg = u.searchParams.get('segment'), cat = u.searchParams.get('category');
    const jobs = DATA.list.jobs.filter(j => (!q || `${j.title} ${j.tags} ${j.company_name}`.toLowerCase().includes(q)) && (!seg || j.segment === seg) && (!cat || j.category === cat))
      .map(j => ({ ...j, match: matchOf(j) }));
    return reply(200, { ...DATA.list, jobs, companies: new Set(jobs.map(j => j.company_id)).size });
  }
  if ((x = p.match(/^\/api\/jobs\/(\d+)\/apply$/))) {
    const d = DATA.job[x[1]];
    if (!mock.user) return err(401, 'Please log in first');
    if (!mock.user.resume_name) return err(400, 'Upload your resume in your profile before applying', { code: 'NO_RESUME' });
    const paid = covers(d.job.segment), again = mock.apps.some(a => a.job_id == x[1]);
    if (!paid && !again && !trial().left) return err(402, `You've used your ${FREE} free applications.`, { code: 'NEED_PLAN', segment: d.job.segment });
    if (d.unlocked.level === 'risky' && !body?.confirmRisky) return err(409, 'This job failed our background check. Are you sure?', { code: 'RISKY' });
    if (!again) mock.apps.unshift({ job_id: d.job.id, title: d.job.title, company: d.company.name, applied_at: today(), status: 'applied', job_status: 'open' });
    return reply(200, { apply_url: DATA.applyUrl[x[1]], free: !paid && !again, trial: trial() });
  }
  if ((x = p.match(/^\/api\/jobs\/(\d+)$/))) {
    const d = DATA.job[x[1]]; if (!d) return err(404, 'Job not found');
    const applied = mock.apps.some(a => a.job_id == x[1]);
    const paid = Boolean(mock.user && covers(d.job.segment));
    const free = Boolean(mock.user && !paid && (applied || trial().left > 0));
    const unlocked = paid || free;
    return reply(200, { job: { ...d.job, match: matchOf(d.job) }, company: d.company, segment: d.segment, unlocked, paid, free,
      report: unlocked ? d.unlocked : d.locked, applied, trial: trial() });
  }
  if ((x = p.match(/^\/api\/companies\/(\d+)\/report$/))) return reply(200, { ok: true });
  if ((x = p.match(/^\/api\/companies\/(\d+)$/))) {
    const d = DATA.company[x[1]]; if (!d) return err(404, 'Company not found');
    const unlocked = Boolean(mock.user && (mock.plans.length || trial().left > 0));
    return reply(200, { company: d.company, jobs: d.jobs, unlocked, report: unlocked ? d.unlocked : d.locked });
  }
  return err(404, 'Not available in the preview');
};

// Navigation inside the preview: keep the route in memory (artifact links only carry a plain #name).
const loc = { _h: '#/', get hash() { return this._h; }, set hash(v) { this._h = v; route(); } };
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]');
  if (a && !a.classList.contains('skip-link')) { e.preventDefault(); loc.hash = a.getAttribute('href'); }
});

// In-page confirmation (the viewer has no confirm())
function uiConfirm(message) {
  return new Promise(resolve => {
    const d = document.createElement('div');
    d.className = 'modal';
    d.innerHTML = `<div class="card" role="dialog" aria-modal="true"><p></p><div class="acts" style="justify-content:flex-end;margin-top:14px">
      <button type="button" class="btn" data-v="0">Cancel</button><button type="button" class="btn primary" data-v="1">OK</button></div></div>`;
    d.querySelector('p').textContent = message;
    d.addEventListener('click', e => { const v = e.target.dataset?.v; if (v === undefined) return; d.remove(); resolve(v === '1'); });
    document.body.append(d); d.querySelector('[data-v="1"]').focus();
  });
}
</script>
<script>// Parakh front end: hash routes -> page functions. No framework needed.
const $ = s => document.querySelector(s);
const $app = $('#app');
const state = { user: null, plans: [] };

const SEG = { basic: 'Entry', pro: 'Professional', premium: 'Senior & Specialist' };
const LEVEL = { verified: 'Verified', caution: 'Check carefully', risky: 'Risky' };
const TONE = { verified: 'ok', caution: 'warn', risky: 'bad' };
const ATS = { greenhouse: 'Greenhouse', lever: 'Lever', ashby: 'Ashby' };

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const inr = n => '₹' + Math.round(n).toLocaleString('en-IN');
const parseDate = d => new Date(String(d).includes('T') ? d : String(d).replace(' ', 'T') + 'Z');
const fmtDate = d => (d ? parseDate(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '');
const ago = d => { const days = Math.floor((Date.now() - parseDate(d)) / 864e5); return days <= 0 ? 'today' : days === 1 ? '1 day ago' : `${days} days ago`; };
const salary = j => (j.salary_min ? `$${Math.round(j.salary_min / 1000)}k–$${Math.round(j.salary_max / 1000)}k / yr` : 'Pay not listed');
// Every job on Parakh is remote; show who can apply, e.g. "Remote · India"
const remoteWhere = loc => { const l = String(loc || '').replace(/^remote\s*[,·–-]?\s*/i, '').trim(); return `Remote · ${esc(l || 'Worldwide')}`; };
const freeN = () => state.trial?.limit ?? 2;   // free applications every new user gets
const domainOf = url => { try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return ''; } };
const params = () => new URLSearchParams(loc.hash.split('?')[1] || '');

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('on'), 3200);
}

// Trust score dial. level: verified | caution | risky (or null while unknown)
function seal(score, level, size = 52) {
  const tone = level ? TONE[level] : 'none', C = 2 * Math.PI * 21, off = score == null ? C : C * (1 - score / 100);
  return `<div class="seal ${tone === 'ok' ? '' : tone}" style="width:${size}px;height:${size}px" role="img"
    aria-label="${score == null ? 'Score pending' : `Trust score ${score} out of 100, ${LEVEL[level]}`}">
    <svg viewBox="0 0 50 50"><circle class="trk" cx="25" cy="25" r="21"/><circle class="arc" cx="25" cy="25" r="21" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg>
    <span class="n" aria-hidden="true">${score ?? '…'}</span></div>`;
}
const pill = level => `<span class="pill ${TONE[level]}">${LEVEL[level]}</span>`;
const stIcon = s => `<span class="st ${s}" aria-hidden="true">${s === 'ok' ? '✓' : s === 'warn' ? '!' : s === 'bad' ? '✕' : '–'}</span>`;

async function api(path, opts = {}) {
  const isForm = opts.body instanceof FormData;
  const res = await fetch(path, { ...opts, headers: isForm ? {} : { 'Content-Type': 'application/json' },
    body: opts.body && !isForm ? JSON.stringify(opts.body) : opts.body });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.error || 'Something went wrong. Try again.'), { status: res.status, data });
  return data;
}

async function loadMe() { Object.assign(state, await api('/api/me')); }

function renderNav(page) {
  const u = state.user;
  const link = (href, label, key) => `<a href="${href}"${page === key ? ' aria-current="page"' : ''}>${label}</a>`;
  $('#nav').innerHTML = link('#/', 'Jobs', 'jobs') + link('#/scan', 'Scan a job', 'scan') + link('#/pricing', 'Pricing', 'pricing') +
    (u ? (u.is_admin ? link('#/admin', 'Admin', 'admin') : '') + link('#/profile', 'My profile', 'profile') + '<button type="button" id="logout">Log out</button>'
       : link('#/login', 'Log in', 'login') + '<a href="#/signup" class="btn primary sm">Sign up</a>');
  $('#logout')?.addEventListener('click', async () => { await api('/api/logout', { method: 'POST' }); await loadMe(); loc.hash = '#/'; toast('Logged out.'); });
}

// ---------- jobs ----------
async function jobsPage() {
  const p = params();
  $app.innerHTML = `
    <section class="hero">
      <div>
        <p class="eyebrow">For Indian professionals · International companies · Remote</p>
        <h1>Every remote job, <em>background-checked</em> before you apply.</h1>
        <p class="lede">We check each company's founding year, website age, how many jobs it posts, how many it fills, and whether the apply link is on the company's own hiring system. You apply on the employer's page.</p>
        <p class="lede"><b>Your first ${freeN()} applications are free</b>, with the full background check. ${state.user ? '' : '<a href="#/signup">Create a free account</a>'}</p>
      </div>

    </section>
    <form class="toolbar" id="filters" role="search">
      <label for="q" class="sr-only">Search jobs</label>
      <input id="q" name="q" type="search" placeholder="Search role, skill or company" value="${esc(p.get('q'))}">
      <div class="chips" role="group" aria-label="Filter by plan">${[['', 'All'], ...Object.entries(SEG)].map(([k, l]) =>
        `<button type="button" class="chip" data-seg="${k}" aria-pressed="${(p.get('segment') || '') === k}">${l}</button>`).join('')}</div>
      <label for="category" class="sr-only">Category</label>
      <select id="category" name="category"><option value="">All categories</option></select>
      <span class="count" id="count" role="status"></span>
    </form>
    <div class="jobs" id="jobList"></div>
    <details class="blocked" id="blocked" hidden><summary>${stIcon('bad')}<span id="blockedTitle"></span></summary><ul id="blockedList"></ul></details>
    <p class="sources" id="sources"></p>`;

  const f = $('#filters');
  const filters = { q: p.get('q') || '', segment: p.get('segment') || '', category: p.get('category') || '' };
  const update = () => {
    const qs = new URLSearchParams(Object.entries(filters).filter(([, v]) => v)).toString();
    loc._h = '#/' + (qs ? '?' + qs : '');
    loadJobs(filters);
  };
  f.addEventListener('submit', e => { e.preventDefault(); filters.q = f.q.value.trim(); update(); });
  let t; f.q.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { filters.q = f.q.value.trim(); update(); }, 300); });
  f.querySelectorAll('[data-seg]').forEach(b => b.addEventListener('click', () => {
    filters.segment = b.dataset.seg;
    f.querySelectorAll('[data-seg]').forEach(x => x.setAttribute('aria-pressed', x === b));
    update();
  }));
  f.category.addEventListener('change', () => { filters.category = f.category.value; update(); });

  await loadJobs(filters, true);
  api('/api/sources').then(({ sources }) => {
    $('#sources').innerHTML = `Jobs collected from ${sources.map(s => s.site ? `<a href="${esc(s.site)}" target="_blank" rel="noopener">${esc(s.label)}</a>` : esc(s.label)).join(', ')}. You always apply on the original listing.`;
  }).catch(() => {});
}

async function loadJobs(filters, first = false) {
  const data = await api('/api/jobs?' + new URLSearchParams(filters));
  const sel = $('#category');
  if (!sel) return;   // user navigated away
  if (first) { sel.innerHTML += data.categories.map(c => `<option>${esc(c)}</option>`).join(''); sel.value = filters.category; }
  $('#status').innerHTML = `<span><i class="dot" aria-hidden="true"></i><b>${data.jobs.length} verified job${data.jobs.length === 1 ? '' : 's'}</b> from <b>${data.companies} compan${data.companies === 1 ? 'y' : 'ies'}</b></span>
    <span>${data.last_refresh ? `Last refreshed ${esc(ago(data.last_refresh))}` : 'Refreshed every 6 hours'} · risky jobs are hidden</span>`;
  $('#count').textContent = `${data.jobs.length} shown`;
  $('#jobList').innerHTML = data.jobs.length ? data.jobs.map(j => `
    <article class="job">
      ${seal(j.trust_score, j.trust_level)}
      <div style="min-width:0">
        <h2><a href="#/job/${j.id}">${esc(j.title)}</a></h2>
        <div class="co"><button type="button" class="linkbtn" data-company="${j.company_id}">${esc(j.company_name)}</button>
          <span>${remoteWhere(j.location)}</span>${j.hq_country ? `<span>HQ ${esc(j.hq_country)}</span>` : ''}${j.founded_year ? `<span>Founded ${j.founded_year}</span>` : ''}</div>
        <div class="tags"><span class="tag seg">${SEG[j.segment]}</span>${j.category ? `<span class="tag">${esc(j.category)}</span>` : ''}
          ${j.match != null ? `<span class="tag ${j.match >= 50 ? 'ok' : ''}">Skill match ${j.match}%</span>` : ''}<span class="tag">via ${esc(j.source)}</span><span class="tag">${esc(ago(j.posted_at))}</span></div>
      </div>
      <div class="side"><div class="pay">${salary(j)}</div>
        <div class="acts"><button type="button" class="btn sm" data-company="${j.company_id}">Report</button><a class="btn primary sm" href="#/job/${j.id}">View &amp; apply</a></div></div>
    </article>`).join('')
    : `<div class="empty"><b>No verified jobs match that search</b>Try another skill, company or plan.</div>`;
  const b = $('#blocked');
  b.hidden = !data.blocked.length;
  $('#blockedTitle').textContent = `${data.hidden_risky} job${data.hidden_risky === 1 ? '' : 's'} hidden because they failed our checks`;
  $('#blockedList').innerHTML = data.blocked.map(x => `<li><b>${esc(x.title)}</b> at ${esc(x.company)} · ${esc(x.why)}</li>`).join('');
}

// ---------- company report (used in the drawer, the company page and the job page) ----------
function reportHtml(c, r, unlocked) {
  const year = new Date().getFullYear(), s = r.stats || {};
  const facts = `<dl class="facts">
    <div><dt>Founded</dt><dd>${c.founded_year ? `${c.founded_year} (${year - c.founded_year} yrs)` : 'Not public'}</dd></div>
    <div><dt>Team size</dt><dd>${c.employee_count ? `${c.employee_count} people` : 'Not public'}</dd></div>
    <div><dt>Website since</dt><dd>${c.domain_created ? fmtDate(c.domain_created) : c.website ? 'Not checked yet' : 'No website'}</dd></div>
    <div><dt>Hiring system</dt><dd>${c.ats_type ? `${ATS[c.ats_type]} careers page` : 'Job boards'}</dd></div></dl>`;
  const checks = `<ul class="checks">${r.signals.map(x => `<li>${stIcon(x.impact > 0 ? 'ok' : x.impact <= -8 ? 'bad' : x.impact < 0 ? 'warn' : 'n')}
    <span>${esc(x.label)}</span><span class="val">${x.impact > 0 ? '+' : ''}${x.impact}</span>${x.detail ? `<span class="det">${esc(x.detail)}</span>` : ''}</li>`).join('')}</ul>`;
  if (!unlocked) return `<div class="report-grid">${facts}<div><p class="sub">Checks</p>${checks}</div>
    <div class="lock">${r.hidden_signals ? `${r.hidden_signals} more checks, ` : 'More checks, '}the hiring history and the apply link are locked.
      ${state.user ? `You've used your ${freeN()} free applications. A pass costs from ${inr(2 * (state.fx || 84))} a month.`
        : `<b>Sign up free:</b> your first ${freeN()} applications include the full background check.`}
      <div class="acts" style="margin-top:10px;justify-content:center">${state.user ? '' : '<a class="btn primary sm" href="#/signup">Sign up free</a>'}<a class="btn sm" href="#/pricing">See plans</a></div></div></div>`;
  const max = Math.max(1, ...(s.monthly || []).map(m => m.n));
  return `<div class="report-grid">${facts}
    <div><p class="sub">Hiring activity</p>
      <dl class="facts">
        <div><dt>Jobs posted, last 30 days</dt><dd>${s.posted30}</dd></div><div><dt>Jobs posted, last 90 days</dt><dd>${s.posted90}</dd></div>
        <div><dt>Open now</dt><dd>${s.open}</dd></div><div><dt>Closed or filled</dt><dd>${s.closed}</dd></div>
        <div><dt>Days a job stays open</dt><dd>${s.avgDaysOpen ?? '–'}</dd></div><div><dt>Members hired here</dt><dd>${s.reports?.hired || 0}</dd></div></dl>
      ${s.monthly?.length ? `<div class="bars" role="img" aria-label="Jobs posted per month: ${s.monthly.map(m => `${m.month} ${m.n}`).join(', ')}">${s.monthly.map(m =>
        `<div style="height:${(m.n / max) * 100}%"><span>${m.month.slice(5)}</span></div>`).join('')}</div>` : ''}
      <p class="hint">Companies don't publish how many people they hire, so we count jobs that close, plus what our members report.</p></div>
    <div><p class="sub">Checks</p>${checks}</div></div>`;
}

let drawerOpener = null;

  drawerOpener = document.activeElement;

  if (!d) return;
  const c = d.company;
  $('#drHead').innerHTML = `${seal(d.report.score, d.report.level, 56)}<div style="min-width:0"><h2 id="drTitle">${esc(c.name)}</h2>
    <p class="mono">${esc(domainOf(c.website) || 'no website')}${c.hq_country ? ' · ' + esc(c.hq_country) : ''}</p></div>
    <button type="button" class="btn ghost sm x" id="drClose" aria-label="Close report">✕</button>`;
  const open = d.jobs.filter(j => j.status === 'open');
  $('#drBody').innerHTML = `${c.description ? `<p>${esc(c.description)}</p>` : ''}${reportHtml(c, d.report, d.unlocked)}
    <div><p class="sub">Open jobs here (${open.length})</p>${open.map(j => `<div style="display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px">

function closeCompany() {
  if (!$('#drawer').classList.contains('on')) return;
  $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on'); $('#drawer').setAttribute('aria-hidden', 'true');
  drawerOpener?.focus?.();
}
$('#scrim').addEventListener('click', closeCompany);
addEventListener('keydown', e => { if (e.key === 'Escape') closeCompany(); });
document.addEventListener('click', e => {
  const b = e.target.closest('[data-company]');
  if (b) { e.preventDefault(); openCompany(b.dataset.company); return; }

});

    </div>
    <div class="grid2">

        ${state.user ? `<div class="card"><h2>Applied here before? Tell others</h2><p class="hint" style="margin-bottom:12px">Your answer changes this company's score.</p>

// ---------- scan a job ----------
const SAMPLE_SCAM = 'Hiring for Amazon work-from-home data entry. Earn ₹4,000 per day, no experience needed. Limited seats! Pay ₹1,499 one-time registration fee for your training kit. Contact HR Priya on Telegram @amazon_jobs_hr or email amazonhiring.india@gmail.com';
function scanPage() {
  $app.innerHTML = `
    <div class="sec-head"><div><h1>Scan a job post or recruiter message</h1>
      <p>Got a job on WhatsApp, Telegram, Naukri or LinkedIn and not sure it's real? Paste it here. We check it for the signs that most job scams in India share.</p></div></div>
    <div class="grid2">
      <form class="card" id="scanForm">
        <div class="fields">
          <div class="field"><label for="scCompany">Company name</label><input id="scCompany" name="company" placeholder="e.g. GlobalEarn Partners" autocomplete="off"></div>
          <div class="field"><label for="scSite">Company website (if given)</label><input id="scSite" name="website" placeholder="e.g. globalearn-partners.online" autocomplete="off"></div>
          <div class="field full"><label for="scText">Job post or message</label>
            <textarea id="scText" name="text" aria-describedby="scHint">${esc(SAMPLE_SCAM)}</textarea>
            <span class="hint" id="scHint">The example above is a typical scam message. Replace it with yours.</span></div>
          <div class="field full acts"><button class="btn primary" type="submit" id="scanBtn">Check this job</button>
            <button class="btn" type="button" id="reqBtn">Ask us to check this company</button></div>
        </div>
      </form>
      <div class="card" aria-live="polite">
        <h2>Result</h2>
        <ul class="checks" id="scanChecks"><li>${stIcon('n')}<span class="muted">Paste a job and press Check this job.</span><span></span></li></ul>
        <div id="scanVerdict"></div><div id="scanKnown"></div>
      </div>
    </div>`;
  const f = $('#scanForm');
  f.addEventListener('submit', async e => {
    e.preventDefault();
    $('#scanBtn').disabled = true;
    $('#scanChecks').innerHTML = `<li><span class="st run" aria-hidden="true"></span><span>Checking…</span><span></span></li>`;
    try {
      const r = await api('/api/scan', { method: 'POST', body: { company: f.company.value, website: f.website.value, text: f.text.value } });
      $('#scanChecks').innerHTML = r.checks.map(k => `<li>${stIcon(k.status)}<span>${esc(k.label)}</span>
        <span class="val">${k.label === 'Website age' ? '' : k.status === 'ok' ? 'not found' : 'found'}</span>${k.detail ? `<span class="det">${esc(k.detail)}</span>` : ''}</li>`).join('');
      const level = r.verdict === 'clear' ? 'verified' : r.verdict === 'suspicious' ? 'caution' : 'risky';
      $('#scanVerdict').innerHTML = `<div class="verdict">${seal(r.score, level, 48)}<p style="flex:1"><strong>${
        r.verdict === 'scam' ? 'Likely a scam' : r.verdict === 'suspicious' ? 'Be careful' : 'No common scam signs'}</strong>${
        r.verdict === 'clear' ? 'That alone doesn\'t prove it\'s real. Find the same job on the company\'s own careers page before you apply.'
        : 'Do not pay anything or share your Aadhaar, PAN, bank details or OTPs.'}</p></div>`;
      $('#scanKnown').innerHTML = r.known ? `<div class="verdict">${seal(r.known.score, r.known.level, 44)}<p style="flex:1"><strong>${esc(r.known.name)} is in our records</strong>
        Make sure the job is also on ${esc(domainOf(r.known.website) || 'its own careers page')}.</p><button type="button" class="btn sm" data-company="${r.known.id}">Open report</button></div>` : '';
    } catch (err) { $('#scanChecks').innerHTML = ''; toast(err.message); }
    finally { $('#scanBtn').disabled = false; }
  });
  $('#reqBtn').addEventListener('click', async () => {
    if (!f.company.value.trim()) { toast('Enter the company name first.'); f.company.focus(); return; }
    if (!state.user) { toast('Log in to ask for a company check.'); loc.hash = '#/login?next=' + encodeURIComponent('#/scan'); return; }
    try { await api('/api/check-requests', { method: 'POST', body: { company: f.company.value, website: f.website.value } }); toast(`Thanks. We'll research ${f.company.value.trim()} and add its report.`); }
    catch (err) { toast(err.message); }
  });
}

    renderPay();
  };
  $('#plans').addEventListener('click', e => { const el = e.target.closest('[data-plan]'); if (el) select(el.dataset.plan); });
  $('#plans').addEventListener('keydown', e => {
    const keys = Object.keys(SEG), i = keys.indexOf(picked);
    const next = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
    if (next) { e.preventDefault(); select(keys[(i + next + keys.length) % keys.length]); $(`[data-plan="${picked}"]`).focus(); }
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); select(e.target.closest('[data-plan]')?.dataset.plan || picked); }
  });
  renderPay();
}

async function buy(segment) {
  if (!state.user) { loc.hash = '#/login?next=' + encodeURIComponent('#/pricing'); return; }
  try {
    const o = await api('/api/checkout', { method: 'POST', body: { segment } });
    const done = async payload => {
      await api('/api/checkout/verify', { method: 'POST', body: { subscription_id: o.subscription_id, ...payload } });
      await loadMe(); toast('Payment received. Your pass is active.'); route();
    };
    if (o.mode === 'demo') { if (await uiConfirm(`Demo payment of ${inr(o.amount_inr)}. Activate the pass?`)) await done({}); return; }
    await loadScript('https://checkout.razorpay.com/v1/checkout.js');
    new Razorpay({ key: o.key_id, order_id: o.order_id, amount: o.amount, currency: 'INR', name: 'Parakh', description: o.description,
      prefill: { name: o.name, email: o.email }, theme: { color: '#B05000' }, handler: r => done(r).catch(e => toast(e.message)) }).open();
  } catch (e) { toast(e.message); }
}
const loadScript = src => new Promise((ok, fail) => {
  if (document.querySelector(`script[src="${src}"]`)) return ok();
  document.head.append(Object.assign(document.createElement('script'), { src, onload: ok, onerror: fail }));
});

// ---------- profile ----------

            <span class="hint" id="pSkillsHint">We use these to match you with jobs.</span></div>
          ${u.resume_name
            ? `<div class="file">${stIcon('ok')}<a class="name">${esc(u.resume_name)}</a><label class="btn ghost sm" for="pResume">Replace</label></div>`
            : `<label class="drop" id="drop" for="pResume"><b>Upload your resume</b><span>PDF or Word, up to 5 MB. Drag it here or click. You need one before applying.</span></label>`}
          <input id="pResume" type="file" accept=".pdf,.doc,.docx" class="sr-only" aria-label="Resume file, PDF or Word, up to 5 MB">

        </div>
      </form>
      <div class="stack">

          ? state.plans.map(p => `<p><b>${esc(SEG[p.segment])}</b> · active until ${esc(fmtDate(p.expires_at))}</p>`).join('')
          : `<p style="margin-bottom:6px"><b>Free trial:</b> ${state.trial.used} of ${state.trial.limit} free applications used.</p>
            <p class="hint" style="margin-bottom:12px">${state.trial.left ? `You can apply to ${state.trial.left} more job${state.trial.left === 1 ? '' : 's'} for free.` : 'Your free applications are used up. Get a pass to keep applying.'}</p>

            <span><a href="#/job/${a.job_id}">${esc(a.title)}</a><small>${esc(a.company)} · ${esc(fmtDate(a.applied_at))}${a.job_status === 'closed' ? ' · job closed' : ''}</small></span>

        <div class="card"><h2>Your best matches</h2>${u.skills ? (matches.length ? `<div class="matches">${matches.map(j => `<div class="match"><span class="fit">${j.match}%</span>

// ---------- router ----------
async function route() {
  closeCompany();
  const [path] = loc.hash.slice(1).split('?');
  const [page = '', id] = (path || '/').split('/').filter(Boolean);
  const key = { '': 'jobs', job: 'jobs', company: 'jobs' }[page] ?? page;
  renderNav(key);
  try {
    if (!page) await jobsPage();
    else if (page === 'job') await jobPage(id);
    else if (page === 'company') await companyPage(id);
    else if (page === 'scan') scanPage();
    else if (page === 'pricing') await pricingPage();
    else if (page === 'login' || page === 'signup') authPage(page);
    else if (page === 'profile') await profilePage();
    else if (page === 'admin') await adminPage();
    else $app.innerHTML = '<div class="empty"><b>Page not found</b><a href="#/">Go to jobs</a></div>';
  } catch (e) { $app.innerHTML = `<div class="notice bad" role="alert">${esc(e.message)}</div>`; }
  const h = $app.querySelector('h1');
  document.title = (h && page ? h.textContent.trim() + ' · ' : '') + 'Parakh – Verified remote jobs for India';
  if (route.ran) { $app.focus({ preventScroll: true }); scrollTo(0, 0); }
  route.ran = true;
}

// "Skip to content" moves focus without changing the page address (the address holds the current page).
document.querySelector('.skip-link').addEventListener('click', e => { e.preventDefault(); $app.focus(); });


loadMe().then(route);
</script>
