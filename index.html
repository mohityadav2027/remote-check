<style>body{margin:0}:root {
  --bg: #f6f7fb; --card: #fff; --text: #1d2433; --muted: #667085; --line: #e4e7ec;
  --brand: #4f46e5; --brand-ink: #fff;
  --ok: #067647; --ok-bg: #dcfae6; --warn: #b54708; --warn-bg: #fef0c7; --bad: #b42318; --bad-bg: #fee4e2;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0f1218; --card: #171b24; --text: #e6e8ee; --muted: #98a2b3; --line: #2a303c; --brand: #8b93ff; --brand-ink: #0f1218;
    --ok-bg: #0b3a24; --ok: #6ce9a6; --warn-bg: #4a2a06; --warn: #fdb022; --bad-bg: #4b1410; --bad: #fda29b;  color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0f1218; --card: #171b24; --text: #e6e8ee; --muted: #98a2b3; --line: #2a303c; --brand: #8b93ff; --brand-ink: #0f1218;
    --ok-bg: #0b3a24; --ok: #6ce9a6; --warn-bg: #4a2a06; --warn: #fdb022; --bad-bg: #4b1410; --bad: #fda29b;  color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
a { color: var(--brand); text-decoration: underline; text-underline-offset: 2px; }
nav a, .logo, .job h2 a, a.btn, a.muted, .skip-link { text-decoration: none; }
.topbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; flex-wrap: wrap; gap: 8px; }
.logo { font-weight: 800; font-size: 20px; color: var(--text); } .logo span { color: var(--brand); }
nav a, nav button { margin-left: 14px; font-size: 14px; }
main { max-width: 1000px; margin: 0 auto; padding: 20px 16px 60px; }
.footer { text-align: center; color: var(--muted); font-size: 13px; padding: 20px 16px 40px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 14px; }
.hero { text-align: center; padding: 24px 0 10px; } .hero h1 { margin: 0 0 6px; font-size: clamp(24px, 4vw, 34px); }
.muted { color: var(--muted); } .small { font-size: 13px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
input, select, textarea { font: inherit; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); width: 100%; }
label { font-size: 13px; color: var(--muted); display: block; margin: 10px 0 4px; }
.filters input { flex: 2; min-width: 180px; } .filters select { flex: 1; min-width: 140px; width: auto; }
button, .btn { font: inherit; cursor: pointer; border: 0; border-radius: 8px; padding: 9px 16px; background: var(--brand); color: var(--brand-ink); font-weight: 600; display: inline-block; }
button.ghost, .btn.ghost { background: transparent; color: var(--brand); border: 1px solid var(--line); }
button:disabled { opacity: .5; cursor: default; }
.job h2 { margin: 0; font-size: 17px; } .job h2 a { color: var(--text); }
.pill { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); }
.badge { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; white-space: nowrap; }
.verified { background: var(--ok-bg); color: var(--ok); } .caution { background: var(--warn-bg); color: var(--warn); } .risky { background: var(--bad-bg); color: var(--bad); }
.score { font-size: 44px; font-weight: 800; line-height: 1; }
.signals { list-style: none; padding: 0; margin: 10px 0 0; }
.signals li { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.signals .imp { font-weight: 700; min-width: 38px; } .plus { color: var(--ok); } .minus { color: var(--bad); } .zero { color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-top: 10px; }
.stat { background: var(--bg); border-radius: 10px; padding: 10px; } .stat b { font-size: 22px; display: block; }
.bars { display: flex; align-items: flex-end; gap: 4px; height: 70px; margin-top: 10px; }
.bars div { flex: 1; background: var(--brand); border-radius: 4px 4px 0 0; min-height: 3px; position: relative; }
.bars span { position: absolute; bottom: -18px; left: 0; right: 0; text-align: center; font-size: 10px; color: var(--muted); }
.locked { border: 1px dashed var(--brand); background: color-mix(in srgb, var(--brand) 6%, var(--card)); }
.price { font-size: 30px; font-weight: 800; } .plan.best { border: 2px solid var(--brand); }
.alert { padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; } .alert.err { background: var(--bad-bg); color: var(--bad); } .alert.ok { background: var(--ok-bg); color: var(--ok); }
.desc { white-space: pre-wrap; }
table { width: 100%; border-collapse: collapse; font-size: 14px; } td, th { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
@media (max-width: 600px) { nav a, nav button { margin-left: 8px; } .score { font-size: 34px; } }

/* Accessibility */
.skip-link { position: absolute; left: 12px; top: -48px; z-index: 50; background: var(--brand); color: var(--brand-ink); padding: 8px 14px; border-radius: 8px; font-weight: 600; }
.skip-link:focus { top: 12px; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
main:focus { outline: none; }
button.linklike { background: none; border: 0; padding: 0; color: var(--brand); font-weight: 400; margin-left: 14px; font-size: 14px; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

main, .topbar, .footer { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }
.preview-bar { background: var(--warn-bg); color: var(--warn); font-size: 13px; text-align: center; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.modal { position: fixed; inset: 0; background: rgb(0 0 0 / .45); display: grid; place-items: center; padding: 16px; z-index: 20; }
.modal .card { max-width: 420px; width: 100%; margin: 0; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.job, .card { min-width: 0; } .stats { overflow-wrap: anywhere; }
</style>
</head>

<script>// Preview-only: answers the site's API calls in the browser using captured sample data.
const RANK = { basic: 1, pro: 2, premium: 3 };
const mock = { user: null, plans: [], apps: [] };
const reply = (status, body) => ({ ok: status < 400, status, json: async () => body });
const err = (status, error, extra = {}) => reply(status, { error, ...extra });
const today = (d = 0) => new Date(Date.now() + d * 864e5).toISOString().slice(0, 19).replace('T', ' ');
const covers = seg => mock.plans.some(p => RANK[p.segment] >= RANK[seg]);
function matchOf(job) {
  const skills = (mock.user?.skills || '').toLowerCase().split(',').map(s => s.trim()).filter(Boolean);
  if (!skills.length) return null;
  const text = `${job.title} ${job.tags || ''} ${job.snippet || job.description || ''}`.toLowerCase();
  return Math.round(100 * skills.filter(s => text.includes(s)).length / skills.length);
}

window.fetch = async (url, opts = {}) => {
  const u = new URL(url, 'https://preview.local');
  const p = u.pathname, m = (opts.method || 'GET').toUpperCase();
  const body = typeof opts.body === 'string' ? JSON.parse(opts.body) : opts.body;
  let x;
  if (p === '/api/me') return reply(200, { user: mock.user, plans: mock.plans });
  if (p === '/api/signup' || p === '/api/login') {
    if (!body.email || !body.password || body.password.length < 8) return err(400, 'Enter an email and a password of at least 8 characters');
    mock.user = { id: 1, email: body.email, name: body.name || body.email.split('@')[0], skills: '', headline: '', phone: '', experience_years: 0, resume_name: null, is_admin: 0 };
    return reply(200, { user: mock.user });
  }
  if (p === '/api/logout') { mock.user = null; mock.plans = []; mock.apps = []; return reply(200, { ok: true }); }
  if (p === '/api/profile' && m === 'PUT') { Object.assign(mock.user, body); return reply(200, { user: mock.user }); }
  if (p === '/api/profile/resume') {
    const f = body.get('resume');
    if (!f?.name || !/\.(pdf|docx?)$/i.test(f.name)) return err(400, 'Upload a PDF/DOC/DOCX up to 5 MB');
    mock.user.resume_name = f.name; return reply(200, { user: mock.user });
  }
  if (p === '/api/profile/applications') return reply(200, mock.apps);
  if (p === '/api/sources') return reply(200, { sources: [
    ['Remotive', 'https://remotive.com'], ['Himalayas', 'https://himalayas.app'], ['Remote OK', 'https://remoteok.com'], ['Jobicy', 'https://jobicy.com'],
    ['Working Nomads', 'https://www.workingnomads.com'], ['We Work Remotely', 'https://weworkremotely.com'], ['Company careers pages', null], ['Added by our team', null],
  ].map(([label, site]) => ({ label, site, open: 0 })) });
  if (p === '/api/pricing') return reply(200, { ...DATA.pricing, payments: 'demo' });
  if (p === '/api/checkout') {
    const s = DATA.pricing.segments.find(s => s.key === body.segment);
    return reply(200, { mode: 'demo', subscription_id: s.key, amount_inr: s.inr });
  }
  if (p === '/api/checkout/verify') {
    const s = DATA.pricing.segments.find(s => s.key === body.subscription_id);
    mock.plans.push({ segment: s.key, amount_inr: s.inr, expires_at: today(DATA.pricing.days) });
    return reply(200, { ok: true, plans: mock.plans });
  }
  if (p === '/api/jobs') {
    const q = (u.searchParams.get('q') || '').toLowerCase(), seg = u.searchParams.get('segment'), cat = u.searchParams.get('category');
    const all = DATA.jobs.filter(j => (!q || `${j.title} ${j.tags} ${j.company_name}`.toLowerCase().includes(q)) && (!seg || j.segment === seg) && (!cat || j.category === cat));
    const jobs = all.filter(j => j.trust_level !== 'risky').map(j => ({ ...j, match: matchOf(j) }));
    return reply(200, { jobs, categories: [...new Set(DATA.jobs.map(j => j.category))].sort(), hidden_risky: all.length - jobs.length });
  }
  if ((x = p.match(/^\/api\/jobs\/(\d+)\/apply$/))) {
    const d = DATA.job[x[1]];
    if (!mock.user) return err(401, 'Please log in first');
    if (!mock.user.resume_name) return err(400, 'Upload your resume in your profile before applying', { code: 'NO_RESUME' });
    if (!covers(d.job.segment)) return err(402, 'Plan needed', { code: 'NEED_PLAN', segment: d.job.segment });
    if (d.unlocked.level === 'risky' && !body?.confirmRisky) return err(409, 'This job failed our background check. Are you sure?', { code: 'RISKY' });
    if (!mock.apps.some(a => a.job_id == x[1])) mock.apps.unshift({ job_id: d.job.id, title: d.job.title, company: d.company.name, applied_at: today() });
    return reply(200, { apply_url: DATA.applyUrl[x[1]] });
  }
  if ((x = p.match(/^\/api\/jobs\/(\d+)$/))) {
    const d = DATA.job[x[1]]; if (!d) return err(404, 'Job not found');
    const unlocked = Boolean(mock.user && covers(d.job.segment));
    return reply(200, { job: { ...d.job, match: matchOf(d.job) }, company: d.company, segment: d.segment, unlocked,
      report: unlocked ? d.unlocked : d.locked, applied: mock.apps.some(a => a.job_id == x[1]) });
  }
  if ((x = p.match(/^\/api\/companies\/(\d+)\/report$/))) return reply(200, { ok: true });
  if ((x = p.match(/^\/api\/companies\/(\d+)$/))) {
    const d = DATA.company[x[1]]; if (!d) return err(404, 'Company not found');
    const unlocked = Boolean(mock.user && mock.plans.length);
    return reply(200, { company: d.company, jobs: d.jobs, unlocked, report: unlocked ? d.unlocked : d.locked });
  }
  return err(404, 'Not available in the preview');
};

// Navigation inside the preview: keep the route in memory (artifact links only carry a plain #name).
const loc = { _h: '#/', get hash() { return this._h; }, set hash(v) { this._h = v; scrollTo(0, 0); route(); } };
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]');
  if (a && a.id !== 'logout' && !a.classList.contains('skip-link')) { e.preventDefault(); loc.hash = a.getAttribute('href'); }
});

// In-page dialogs (the viewer has no confirm()/prompt()).
function uiDialog(message, withInput) {
  return new Promise(resolve => {
    const d = document.createElement('div');
    d.className = 'modal';
    d.innerHTML = `<div class="card"><p></p>${withInput ? '<textarea id="dlg-input" rows="3"></textarea>' : ''}
      <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="ghost" data-v="0">Cancel</button><button data-v="1">OK</button></div></div>`;
    d.querySelector('p').textContent = message;
    d.addEventListener('click', e => {
      const v = e.target.dataset?.v; if (v === undefined) return;
      const val = withInput ? d.querySelector('textarea').value : true;
      d.remove(); resolve(v === '1' ? val : (withInput ? null : false));
    });
    document.body.append(d); d.querySelector(withInput ? 'textarea' : 'button[data-v="1"]').focus();
  });
}
const uiConfirm = m => uiDialog(m, false);
const uiPrompt = m => uiDialog(m, true);
</script>
<script>// Tiny single-page app: hash routes -> render functions. No framework needed.
const $app = document.getElementById('app');
const state = { user: null, plans: [] };

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const inr = n => '₹' + Number(n).toLocaleString('en-IN');
const ago = d => { const days = Math.floor((Date.now() - Date.parse(d.replace(' ', 'T') + 'Z')) / 864e5); return days <= 0 ? 'today' : days === 1 ? '1 day ago' : `${days} days ago`; };
const LEVEL = { verified: '✔ Verified', caution: '⚠ Check carefully', risky: '✖ Risky' };
const LEVEL_TEXT = { verified: 'Verified', caution: 'Check carefully', risky: 'Risky' };
const badge = (level, score) => `<span class="badge ${level}" role="img" aria-label="${LEVEL_TEXT[level]}${score != null ? `, trust score ${score} out of 100` : ''}">${LEVEL[level]}${score != null ? ` · ${score}` : ''}</span>`;
const salary = j => j.salary_min ? `$${(j.salary_min / 1000).toFixed(0)}k–$${(j.salary_max / 1000).toFixed(0)}k / yr` : '';

async function api(path, opts = {}) {
  const res = await fetch(path, { headers: opts.body instanceof FormData ? {} : { 'Content-Type': 'application/json' }, ...opts,
    body: opts.body && !(opts.body instanceof FormData) ? JSON.stringify(opts.body) : opts.body });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.error || 'Request failed'), { status: res.status, data });
  return data;
}

async function loadMe() { Object.assign(state, await api('/api/me')); renderNav(); }

function renderNav() {
  const u = state.user;
  document.getElementById('nav').innerHTML = `<a href="#/">Jobs</a><a href="#/pricing">Pricing</a>` +
    (u ? `${u.is_admin ? '<a href="#/admin">Admin</a>' : ''}<a href="#/profile">My profile</a><button type="button" class="linklike" id="logout">Logout</button>`
       : `<a href="#/login">Login</a><a href="#/signup" class="btn">Sign up</a>`);
  document.getElementById('logout')?.addEventListener('click', async e => { e.preventDefault(); await api('/api/logout', { method: 'POST' }); await loadMe(); loc.hash = '#/'; });
}

// ---------- pages ----------
async function homePage() {
  const params = new URLSearchParams(loc.hash.split('?')[1] || '');
  $app.innerHTML = `
    <section class="hero">
      <h1>Genuine international remote jobs, open to India</h1>
      <p class="muted">Every company is background-checked: founding year, website age, hiring history, repost patterns and scam signals.</p>
    </section>
    <form class="card row filters" id="f">
      <input name="q" type="search" aria-label="Search jobs" placeholder="Search title, skill or company" value="${esc(params.get('q'))}">
      <select name="segment" aria-label="Experience level"><option value="">All levels</option><option value="basic">Starter (entry / non-tech)</option><option value="pro">Professional</option><option value="premium">Senior / specialist</option></select>
      <select name="category" aria-label="Category"><option value="">All categories</option></select>
      <button>Search</button>
    </form>
    <div id="list"><p class="muted">Loading jobs…</p></div>`;
  const f = document.getElementById('f');
  f.segment.value = params.get('segment') || '';
  f.onsubmit = e => { e.preventDefault(); loc.hash = '#/?' + new URLSearchParams(new FormData(f)).toString(); };

  const data = await api('/api/jobs?' + params.toString());
  f.category.innerHTML += data.categories.map(c => `<option>${esc(c)}</option>`).join('');
  f.category.value = params.get('category') || '';
  document.getElementById('list').innerHTML = `<p class="muted small" role="status">${data.jobs.length} verified job${data.jobs.length === 1 ? '' : 's'}</p>` + (data.jobs.length ? data.jobs.map(j => `
    <article class="card job">
      <div class="row between">
        <div>
          <h2><a href="#/job/${j.id}">${esc(j.title)}</a></h2>
          <a class="muted" href="#/company/${j.company_id}">${esc(j.company_name)}</a>
        </div>
        ${badge(j.trust_level, j.trust_score)}
      </div>
      <p class="muted small">${esc(j.snippet)}…</p>
      <div class="row small">
        <span class="pill">${esc(j.location || 'Remote')}</span>
        ${j.category ? `<span class="pill">${esc(j.category)}</span>` : ''}
        ${salary(j) ? `<span class="pill">${salary(j)}</span>` : ''}
        ${j.match != null ? `<span class="pill">Skill match ${j.match}%</span>` : ''}
        <span class="muted">Posted ${ago(j.posted_at)}</span>
      </div>
    </article>`).join('') : '<div class="card muted">No jobs found.</div>') +
    (data.hidden_risky ? `<p class="muted small">🛡 ${data.hidden_risky} job(s) hidden because they failed our background check.</p>` : '');
  const { sources } = await api('/api/sources');
  document.getElementById('list').insertAdjacentHTML('beforeend', `<p class="muted small">Jobs collected from ${sources.map(x => x.site
    ? `<a href="${esc(x.site)}" target="_blank" rel="noopener">${esc(x.label)}</a>` : esc(x.label)).join(', ')}. You always apply on the original listing.</p>`);
}

function reportCard(report, company) {
  const s = report.stats || {};
  const max = Math.max(1, ...(s.monthly || []).map(m => m.n));
  return `

      </div>

    <div class="card"><h3>Job description</h3><div class="desc">${esc(j.description || 'See original posting.')}</div></div>

      ${[['hired', '🎉 I got hired'], ['interview', '💬 Got an interview'], ['no_response', '🕳 No response'], ['scam', '🚩 Report scam']]
        .map(([k, t]) => `<button class="ghost" data-report="${k}">${t}</button>`).join('')}</div></div>` : ''}`;

  const msg = (t, ok) => { document.getElementById('msg').innerHTML = `<div class="alert ${ok ? 'ok' : 'err'}" role="${ok ? 'status' : 'alert'}">${t}</div>`; scrollTo(0, 0); };
  document.getElementById('apply').onclick = async () => {

      let r;
      try { r = await api(`/api/jobs/${id}/apply`, { method: 'POST', body: {} }); }
      catch (e) {
        if (e.data?.code !== 'RISKY' || !await uiConfirm(e.message)) throw e;
        r = await api(`/api/jobs/${id}/apply`, { method: 'POST', body: { confirmRisky: true } });
      }
      msg(`Saved in "My applications". On the live site this opens the employer's page: <b>${esc(r.apply_url)}</b>`, true);

async function buy(segment) {
  if (!state.user) return (loc.hash = '#/login?next=' + encodeURIComponent('#/pricing'));
  const msg = (t, ok) => document.getElementById('msg').innerHTML = `<div class="alert ${ok ? 'ok' : 'err'}" role="${ok ? 'status' : 'alert'}">${esc(t)}</div>`;
  try {
    const o = await api('/api/checkout', { method: 'POST', body: { segment } });
    const done = async payload => { await api('/api/checkout/verify', { method: 'POST', body: { subscription_id: o.subscription_id, ...payload } }); await loadMe(); msg('Payment successful! Your plan is active.', true); };
    if (o.mode === 'demo') {
      if (await uiConfirm(`DEMO payment of ${inr(o.amount_inr)}. Activate plan?`)) await done({});
      return;
    }
    await loadScript('https://checkout.razorpay.com/v1/checkout.js');
    new Razorpay({
      key: o.key_id, order_id: o.order_id, amount: o.amount, currency: 'INR', name: 'RemoteCheck', description: o.description,
      prefill: { name: o.name, email: o.email }, theme: { color: '#4f46e5' },
      handler: r => done(r).catch(e => msg(e.message)),
    }).open();
  } catch (e) { msg(e.message); }
}
const loadScript = src => new Promise((ok, fail) => { if (document.querySelector(`script[src="${src}"]`)) return ok(); const s = Object.assign(document.createElement('script'), { src, onload: ok, onerror: fail }); document.head.append(s); });

// ---------- router ----------
async function route() {
  const [path] = loc.hash.slice(1).split('?');
  const parts = (path || '/').split('/').filter(Boolean);
  try {
    if (!parts.length) await homePage();
    else if (parts[0] === 'job') await jobPage(parts[1]);
    else if (parts[0] === 'company') await companyPage(parts[1]);
    else if (parts[0] === 'login' || parts[0] === 'signup') authPage(parts[0]);
    else if (parts[0] === 'profile') await profilePage();
    else if (parts[0] === 'pricing') await pricingPage();
    else if (parts[0] === 'admin') await adminPage();
    else $app.innerHTML = '<div class="card">Page not found</div>';
  } catch (e) { $app.innerHTML = `<div class="alert err" role="alert">${esc(e.message)}</div>`; }
  const h = $app.querySelector('h1, h2');
  document.title = (h ? h.textContent.trim() + ' · ' : '') + 'RemoteCheck';
  if (route.ran) $app.focus({ preventScroll: true });
  route.ran = true;
}

// Give each <label> a "for" pointing at the field right after it, so clicking the label and screen readers work.
let labelSeq = 0;
function linkLabels(root) {
  for (const label of root.querySelectorAll('label:not([for])')) {
    if (label.querySelector('input, select, textarea')) continue;
    const field = label.nextElementSibling;
    if (!field || !field.matches('input, select, textarea')) continue;
    field.id ||= `f${++labelSeq}`;
    label.htmlFor = field.id;
  }
}
new MutationObserver(() => linkLabels($app)).observe($app, { childList: true, subtree: true });

// "Skip to content" moves focus without changing the page address (the address holds the current page).
document.querySelector('.skip-link')?.addEventListener('click', e => { e.preventDefault(); $app.focus(); });


loadMe().then(route);
</script>
